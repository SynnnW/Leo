[package]
name = "leo-setup"
version = "0.3.0"
edition = "2021"
description = "Installer Leo"
build = "build.rs"

[[bin]]
name = "LeoSetup"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
